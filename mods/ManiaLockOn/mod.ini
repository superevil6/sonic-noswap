[Desc]
Title="Mania Lock-On"
Description="Adds a SONIC MANIA button to the main menu (the Museum / My Data / Options island) that starts your own copy of the Sonic Mania decompilation and brings Origins back when you quit. Bring your own Sonic Mania (Steam) and your own Windows build of the decompilation: neither is included. The Sonic Mania decompilation (RSDKv5) is by Rubberduckycooly, chuliRMG and Evening Star. Set the decompilation's folder with Configure (it is also looked for in Steam's Sonic Mania folder). Works with or without NoSwap."
Version="0.1.0"
Author="Superevil"

[Main]
; HiteModLoader parses counts as plain integers - never quote numeric values.
; The include dir is the mod's own raw\ folder, which the DLL fills at startup with the game's menu archives plus the
; button's layout and text (from patches\, only for archives no other mod replaces). The DLL reads everything else.
IncludeDirCount=1
IncludeDir0="."
DependsCount=0
DLLFile="ManiaLockOn.dll"
ConfigSchemaFile="ConfigSchema.json"
SaveFile=""
