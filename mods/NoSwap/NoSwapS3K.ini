; NoSwap settings (read when the game starts). Extras are picked in the games themselves: Origins'
; character select for Sonic 1, Sonic 2 and Sonic CD, the save screen for Sonic 3 & Knuckles.

; Debugging: log the loaded sprite sheets every N seconds (0 = off; F8 does it on demand)
[Debug]
ProbeSeconds=0
; Testing cheats: 1 = F7 gives 100 rings and the 7 Chaos Emeralds (Sonic 3 & Knuckles), 0 = off (default)
Cheats=0

; Extras in Origins' own character select (Sonic 1, Sonic 2 and Sonic CD): 1 = on (default), 0 = off
[Menu]
RealKinds=1

; (The SONIC MANIA button in the main menu is its own mod now, Mania Lock-On, set up in HedgeModManager. A [Mania]
; Path left here from an older NoSwap is still read by Lock-On while its own Path is empty.)
